name: Build Life OS v0.7 APK

on:
  push:
    branches:
      - life-os-native-v07-final

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true

      - name: Restore exact tested v0.6 baseline
        shell: bash
        run: |
          cat v06.part00 v06.part01 v06.part02 v06.part03 v06.part04 > LifeOS-v0.6-source.tar.xz
          echo "a4c92f23941e15482f7eb6633ed7ff1e15cb5319688309ca5d1ab750385533ff  LifeOS-v0.6-source.tar.xz" | sha256sum -c -
          mkdir appsrc
          tar -xJf LifeOS-v0.6-source.tar.xz -C appsrc
          test -f appsrc/settings.gradle.kts
          test -f appsrc/app/build.gradle.kts

      - name: Reproduce tested v0.6 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('appsrc/app/src/main/java/com/yash/lifeos/QuickTiles.kt')
          s=p.read_text()
          s=s.replace('subtitle=if(active)LifeRepository(this@FocusTileService).focusLabel() else "${LifeRepository(this@FocusTileService).focusDefaultMin()} min";', 'if(Build.VERSION.SDK_INT>=29) subtitle=if(active)LifeRepository(this@FocusTileService).focusLabel() else "${LifeRepository(this@FocusTileService).focusDefaultMin()} min";')
          s=s.replace('subtitle="Add a task";', 'if(Build.VERSION.SDK_INT>=29) subtitle="Add a task";')
          p.write_text(s)

          mp=Path('appsrc/app/src/main/java/com/yash/lifeos/MainActivity.kt')
          mp.write_text(mp.read_text().replace('Settings.ACTION_ZEN_MODE_SETTINGS', 'Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS'))

          xp=Path('appsrc/app/src/main/res/xml/shortcuts.xml')
          x=xp.read_text()
          replacements={
            'android:shortcutShortLabel="Today"':'android:shortcutShortLabel="@string/shortcut_today_short"',
            'android:shortcutLongLabel="Open Life OS Today"':'android:shortcutLongLabel="@string/shortcut_today_long"',
            'android:shortcutShortLabel="Add task"':'android:shortcutShortLabel="@string/shortcut_add_short"',
            'android:shortcutLongLabel="Quick capture a task"':'android:shortcutLongLabel="@string/shortcut_add_long"',
            'android:shortcutShortLabel="Focus"':'android:shortcutShortLabel="@string/shortcut_focus_short"',
            'android:shortcutLongLabel="Start a focus session"':'android:shortcutLongLabel="@string/shortcut_focus_long"',
            'android:shortcutShortLabel="Minimum day"':'android:shortcutShortLabel="@string/shortcut_minimum_short"',
            'android:shortcutLongLabel="Switch Life OS to minimum day"':'android:shortcutLongLabel="@string/shortcut_minimum_long"',
          }
          for a,b in replacements.items():
              x=x.replace(a,b)
          xp.write_text(x)

          sp=Path('appsrc/app/src/main/res/values/strings.xml')
          st=sp.read_text()
          if 'shortcut_today_short' not in st:
              extra='''\n    <string name="shortcut_today_short">Today</string>\n    <string name="shortcut_today_long">Open Life OS Today</string>\n    <string name="shortcut_add_short">Add task</string>\n    <string name="shortcut_add_long">Quick capture a task</string>\n    <string name="shortcut_focus_short">Focus</string>\n    <string name="shortcut_focus_long">Start a focus session</string>\n    <string name="shortcut_minimum_short">Minimum day</string>\n    <string name="shortcut_minimum_long">Switch Life OS to minimum day</string>\n'''
              sp.write_text(st.replace('</resources>', extra+'</resources>'))
          PY

      - name: Verify and apply v0.7 upgrade
        shell: bash
        run: |
          cat v07b64.part00 v07b64.part01 v07b64.part02 v07b64.part03 v07b64.part04 > v07patch.full.b64
          base64 -d v07patch.full.b64 > v07.patch.gz
          echo "c71039723ab9381d96854367abb19e35ef1caaf9075a5dd36cf8f685961b4726  v07.patch.gz" | sha256sum -c -
          gunzip -c v07.patch.gz > v07.patch
          cd appsrc
          git init -q
          git apply --check ../v07.patch
          git apply ../v07.patch
          grep -q 'versionName = "0.7-native"' app/build.gradle.kts

      - name: Validate resources
        shell: bash
        working-directory: appsrc
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('app/src/main/res').rglob('*.xml'))+[Path('app/src/main/AndroidManifest.xml')]
          for f in files:
              ET.parse(f)
          print(f'Validated {len(files)} XML files')
          PY

      - name: Build APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f appsrc/app/build/outputs/apk/debug/app-debug.apk
          unzip -t appsrc/app/build/outputs/apk/debug/app-debug.apk
          cp appsrc/app/build/outputs/apk/debug/app-debug.apk LifeOS-Native-v0.7.apk
          sha256sum LifeOS-Native-v0.7.apk | tee LifeOS-Native-v0.7.sha256
          ls -lh LifeOS-Native-v0.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Native-v0.7-APK
          path: |
            LifeOS-Native-v0.7.apk
            LifeOS-Native-v0.7.sha256
          retention-days: 30
