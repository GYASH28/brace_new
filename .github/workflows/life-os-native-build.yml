name: Build Life OS v0.4 Final APK

on:
  push:
    branches:
      - life-os-native-v04-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore native source
        run: |
          rm -rf life-os-native
          mkdir life-os-native
          tar -xJf life-os-native-v0.4-source.tar.xz -C life-os-native
          test -f life-os-native/settings.gradle.kts
          test -f life-os-native/app/build.gradle.kts

      - name: Build APK
        working-directory: life-os-native
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          test -s life-os-native/app/build/outputs/apk/debug/app-debug.apk
          cp life-os-native/app/build/outputs/apk/debug/app-debug.apk LifeOS-v0.4.apk
          ls -lh LifeOS-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-v0.4-APK
          path: LifeOS-v0.4.apk
          if-no-files-found: error
          retention-days: 7
