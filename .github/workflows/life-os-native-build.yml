name: Build Life OS Native APK

on:
  push:
    branches:
      - life-os-native-build
  workflow_dispatch:

concurrency:
  group: life-os-native-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Life OS project archive
        run: cat life-os-native.b64.part-* | base64 -d > life-os-native.zip

      - name: Unpack Life OS v0.4
        run: |
          rm -rf life-os-native
          mkdir life-os-native
          unzip -q life-os-native.zip -d life-os-native
          shopt -s dotglob
          mv life-os-native/life-os-native-android-v0.4/* life-os-native/
          rmdir life-os-native/life-os-native-android-v0.4
          test -f life-os-native/settings.gradle.kts
          test -f life-os-native/app/build.gradle.kts

      - name: Build installable debug APK
        working-directory: life-os-native
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -s life-os-native/app/build/outputs/apk/debug/app-debug.apk
          ls -lh life-os-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-v0.4-Native-APK
          path: life-os-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
