name: Build Life OS v0.4 Chunks APK

on:
  push:
    branches:
      - life-os-native-v04-chunks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify native source
        run: |
          cat payload/life-os-v04.part-00 payload/life-os-v04.part-01 payload/life-os-v04.part-02 > /tmp/life-os-v04.tar.xz
          echo "2a4ed5ecb9fde02be10646d6f395a3848f10baa77f20acc62b6a3eb1e97eb1b8  /tmp/life-os-v04.tar.xz" | sha256sum -c -
          xz -t /tmp/life-os-v04.tar.xz
          rm -rf life-os-native
          mkdir life-os-native
          tar -xJf /tmp/life-os-v04.tar.xz -C life-os-native
          test -f life-os-native/settings.gradle.kts
          test -f life-os-native/app/build.gradle.kts

      - name: Patch Kotlin compile issues
        run: |
          FILE="life-os-native/app/src/main/java/com/yash/lifeos/MainActivity.kt"
          sed -i 's/import android.app.AppWidgetManager/import android.appwidget.AppWidgetManager/' "$FILE"
          sed -i 's/bottom.visibility = View.VISIBLE/bottom.setVisibility(View.VISIBLE)/' "$FILE"
          sed -i 's/bottom.visibility=View.GONE/bottom.setVisibility(View.GONE)/' "$FILE"
          sed -i 's/goalMs = goalMs/this.goalMs = goalMs/' "$FILE"
          grep -n 'AppWidgetManager\|setVisibility\|this.goalMs' "$FILE"

      - name: Build installable APK
        working-directory: life-os-native
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and collect APK
        run: |
          test -s life-os-native/app/build/outputs/apk/debug/app-debug.apk
          cp life-os-native/app/build/outputs/apk/debug/app-debug.apk LifeOS-v0.4.apk
          ls -lh LifeOS-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-v0.4-APK
          path: LifeOS-v0.4.apk
          if-no-files-found: error
          retention-days: 7
