name: Build Life OS Native APK

on:
  push:
    branches:
      - life-os-native-build
  workflow_dispatch:

concurrency:
  group: life-os-native-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Life OS v0.4 source
        run: |
          rm -rf life-os-native
          mkdir life-os-native
          tar -xJf life-os-native-v0.4-source.tar.xz -C life-os-native
          test -f life-os-native/settings.gradle.kts
          test -f life-os-native/app/build.gradle.kts

      - name: Build installable debug APK
        working-directory: life-os-native
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -s life-os-native/app/build/outputs/apk/debug/app-debug.apk
          cp life-os-native/app/build/outputs/apk/debug/app-debug.apk LifeOS-v0.4.apk
          ls -lh LifeOS-v0.4.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-v0.4-Native-APK
          path: LifeOS-v0.4.apk
          if-no-files-found: error
          retention-days: 7
