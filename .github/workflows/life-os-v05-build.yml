name: Build Life OS v0.5 APK
on:
  push:
    branches: [life-os-native-v05-final2]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore source
        run: |
          cat life-os-v05-part-00 life-os-v05-part-01 life-os-v05-part-02 life-os-v05-part-03 life-os-v05-part-04 > life-os-native-v0.5-source.tar.xz
          echo "58c55041205b0f854f3a32e43ef8a5884bc4ee682e2b1cd3ca517834c3acccff  life-os-native-v0.5-source.tar.xz" | sha256sum -c -
          mkdir appsrc
          tar -xJf life-os-native-v0.5-source.tar.xz -C appsrc
          test -f appsrc/settings.gradle.kts
          test -f appsrc/app/build.gradle.kts
      - name: Apply v0.5 compile fix
        run: |
          sed -i 's/Settings.ACTION_ZEN_MODE_SETTINGS/Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS/g' appsrc/app/src/main/java/com/yash/lifeos/MainActivity.kt
          ! grep -R "ACTION_ZEN_MODE_SETTINGS" appsrc/app/src/main/java
      - name: Build APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        run: test -s appsrc/app/build/outputs/apk/debug/app-debug.apk && ls -lh appsrc/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Native-v0.5-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
